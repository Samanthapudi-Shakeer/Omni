[MERGE_APP_PARAMETERS]

# output_path (string)
#     Format: /path/to/output/directory
#     Description: Directory where merge results will be saved
#     Notes:
#     - Directory will be created if it doesn't exist
#     - A "frf_merging_results_<timestamp>" folder is created inside this directory,
#       containing "merge_results", "merging_log" and "models" subdirectories
#     - Path should be without single quotes ('') or double quotes ("")
#     Example: /home/user/frf_results or C:\Users\user\frf_results
output_path =

# data_dir_list (string)
#     Format: /path/to/data_file_list.txt
#     Description: Path to text file containing absolute paths to .exv, .xpi or .xiz data files
#     Notes:
#     - Text file must exist and be readable
#     - Each line must contain an absolute path to one .exv, .xpi or .xiz file
#     - No empty lines, headers, or comments allowed
#     - Path provided should be without single quotes ('') or double quotes ("")
data_dir_list =

# worst_model_dir_list (string)
#    Format: "/path/to/worst_model_file_list.txt"
#    Description: Path to text file containing absolute paths to worst model .exv, .xpi or .xiz data files
#    Notes:
#    - If not provided, processing proceeds with data_dir_list only
#    - Text file must exist and be readable if provided
#    - Each line must contain an absolute path to one .exv, .xpi or .xiz file
#    - No empty lines, headers, or comments allowed
#    - Files are combined with data_dir_list files (data_dir_list files first),
#      and are tagged "worst" in the per-cluster legend breakdown on Bode plots
#    - Path provided should be without single quotes ('') or double quotes ("")
worst_model_dir_list =

# frequency_segment (list)
#     Format: [freq_min, freq_max]
#     Description: Single frequency segment (Hz) the trained model(s) were trained on
#     Notes:
#     - Both values must be positive numbers, freq_min < freq_max
#     - Every file in data_dir_list (and worst_model_dir_list, if provided) must
#       contain data within this range
#     Example: [9369.14, 10709.8]
frequency_segment = []

# feature_config (string)
#     Format: /path/to/feature_config.json
#     Description: Path to the feature_config.json produced by the training application
#                  alongside the trained model(s)
#     Notes:
#     - If the file contains both stage1 and stage2 feature keys (hierarchical
#       training), only the stage2 features/weightages are used, since flat/
#       combined/merged trained models are always expressed in the stage2
#       feature space
#     - If only stage1 keys are present (non-hierarchical training), those are used
feature_config =

# baseline_data_separation (boolean)
#     Format: True or False
#     Description: Whether the provided trained model(s) were trained per baseline
#                  group (phase_lead / phase_lag / no_resonance) rather than on the
#                  whole segment
#     Options:
#     - True:  trained_models_path must be a dict keyed by baseline group label
#              (see baseline_data_filtering below); requires baseline_data_filtering
#     - False: trained_models_path must be a plain list; the model(s) are applied
#              to the whole loaded dataset directly
baseline_data_separation =

# merge_models (list)
#     Format: one dict per model to merge:
#         [
#             {"name": "<optional str>" or "baseline_group": "<required only when baseline_data_separation=True>"
#              "path": "/path/to/model.json",
#              "clusters_combined": [(...), (...)]},
#             ...
#         ]
#     Description: List of dictionaries that provide the models to be used for merging
#                  and specifies which clusters to be combined
#     Per-entry keys:
#     - "path" (required): existing trained model.json file for this entry
#     - "clusters_combined" (optional, default []): list of tuples of cluster ids
#       (0-indexed) to merge together for this model; each tuple needs >= 2
#       cluster ids, a cluster id may appear in at most one tuple per entry,
#       ids not mentioned stay their own singleton cluster
#     - "baseline_group" (required when baseline_data_separation=True, must be
#       omitted when False): one of "phase_lead", "phase_lag", "no_resonance" to
#       process that group alone, or a tuple of >= 2 of them, e.g.
#       ("phase_lead", "no_resonance"), to combine and process together as one
#       group (case-insensitive; all three combined into one entry is not allowed)l
#     - "name" (optional): arbitrary label used to name this entry's output. If
#       omitted, defaults to the baseline_group label (baseline mode) or
#       "model_<position>" (flat mode)
#     Notes:
#     - The same "path" and/or the same "baseline_group" may be reused across
#       multiple entries (e.g. two different cluster merges from the same
#       trained model, or two models both built from the "phase_lead" group),
#       as long as each entry still resolves to a distinct output name
#     - Every entry's resolved name (explicit "name", or defaulted
#       baseline_group label / "model_<position>") must be unique - config
#       validation rejects the file if two entries would collide on the same
#       output folder name
merge_models = []
