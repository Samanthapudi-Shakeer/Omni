[FILE_LIST_PARAMETERS]

# directory_path (string)
#     Format: /path/to/data_files
#     Description: Path to the directory containing data files in ".exv", ".xpi" or ".xiz" format
#     Notes:
#     - Directory must exist and be discoverable
#     - Data files should have only ".exv", ".xpi" or ".xiz" extensions
#     - Path provided in "directory_path" should be without single quotes ('') or double quotes ("")
directory_path = 

# head (list)
#     Format: ["HD0", "HD1", ...]
#     Description: Specifies which disk head's file are to be included in the ".txt" file
#     Notes:
#     - Head names must start with "HD"
#     - Heads must exist in the data directory
#     - Empty list "[]" is used to indicate no filtering for a parameter
head = []

# cylinder (list)
#     Format: ["CYL000005C7", "CYL0008640B", ...]
#     Description: Specifies which disk cylinder's file are to be included in the ".txt" file. Can be used to generate separate ".txt" files for outer and inner diameter cylinders.
#     Notes:
#     - Cylinder names must start with "CYL"
#     - Cylinders must exist in the data directory
#     - Empty list "[]" is used to indicate no filtering for a parameter
cylinder = []

# temperature (list)
#     Format: ["T0018", "T001F"]
#     Description: Specifies the recorded temperature at which the disk exists and is to be included in the ".txt" file.
#     Notes:
#     - Temperature names must start with "T"
#     - Temperature must exist in the data directory
#     - Empty list "[]" is used to indicate no filtering for a parameter
temperature = []

# file_list_output_path (string)
#     Format 1: /path/to/directory/where/the/file/is_to_be_saved
#     Format 2: /path/to/directory/where/the/file/is_to_be_saved/<output_name>.txt
#     Description: Path to the directory where the "<output_name>_file_list.txt" is to be saved
#     Notes:
#     - Directory must exist and be discoverable
#     - If the path is provided in Format 1, the file will be saved as basename of the data directory provided in "directory_path" with a suffix "_file_list.txt"
#     - If the path is provided in Format 2, the file will be saved as "<output_name>.txt" provided in the path
#     - Path provided in "file_list_output_path" should be without single quotes ('') or double quotes ("")
#     - If custom output path is specified, the parent directory must exist
file_list_output_path = 
