[TRAINING_APP_REQUIRED_PARAMETERS]

# output_path (string)
#     Format: /path/to/output/directory
#     Description: Directory where training analysis results will be saved
#     Notes:
#     - Directory will be created if it doesn"t exist
#     - Analysis output folder with timestamp will be created inside this directory
#     - Path should be without single quotes ("") or double quotes ("")
#     Example: /home/user/frf_results or C:\Users\user\frf_results
output_path =

# data_dir_list (string)
#     Format: /path/to/data_file_list.txt
#     Description: Path to text file containing absolute paths to .exv, .xpi or .xiz data files
#     Notes:
#     - Text file must exist and be readable
#     - Each line must contain an absolute path to one .exv, .xpi or .xiz file
#     - No empty lines, headers, or comments allowed
#     - Path provided in "directory_path" should be without single quotes ("") or double quotes ("")
data_dir_list =

# frequency_segments_max_clusters (dict)
#    Format when hierarchical_clustering = False:
#        {"(start_freq, end_freq)": max_k_value, ...}
#    Format when hierarchical_clustering = True:
#        {"(start_freq, end_freq)": (stage1_max_k, stage2_max_k), ...}
#    Description: Defines frequency segments and maximum number of clusters to train
#    Notes:
#    - When hierarchical_clustering = False: max_k must be an integer >= 2 and <= 10
#      Clustering will train on k values from 2 to max_k
#    - When hierarchical_clustering = True: provide a tuple (stage1_max_k, stage2_max_k)
#      Both values must be integers >= 2 and <= 10 independently
#      Stage 1 clustering trains k=2 to stage1_max_k; Stage 2 trains k=2 to stage2_max_k
#    - Frequency ranges must not overlap
#    - Example (non-hierarchical): {"(9500, 11500)": 7, "(17000, 19300)": 5}
#    - Example (hierarchical)    : {"(9500, 11500)": (4, 3), "(17000, 19300)": (3, 3)}
frequency_segments_max_clusters =

# combined_heads (boolean)
#    Format: True or False
#    Description: Whether to analyze combined heads as specified in "heads" parameter
#    Options:
#    - True: Analyze combined heads as per "heads" list. Must be given in the form of list within the main list
#    - False: Analyze each head individually as specified in "heads" list. Must be given as a list of strings
#    Notes:
#    - If True, "heads" must contain lists of heads to combine within main list.
#    - If False, "heads" must contain individual head names as strings.
#    Example: [["HD0", "HD15"], "HD1"]
combined_heads =

# heads (list or string)
#    Format: ["HD0", "HD1", ...]
#    Description: Specifies which disk heads to analyze
#    Options:
#    - Specific heads: ["HD0", "HD1"] - analyzes only specified heads
#    - Combined heads: [["HD0", "HD1"], ["HD2", "HD3"]] - analyzes combined data from specified heads
#    Notes:
#    - Head names must start with "HD" (e.g., HD0, HD1, HDA, HDB)
#    - Heads must exist in the data directory
#    - If combining heads, heads must be given as lists within the main list
#    - Multiple head combinations are also supported as keywords:
#        all_heads          : every head available in the training data directory
#        odd_number_heads   : heads whose decimal value (HD<hex> converted to decimal) is odd
#        even_number_heads  : heads whose decimal value is even (HD0 is even)
#        outer_heads        : HD0 plus the head with the largest decimal value
#        inner_heads        : all heads other than the outer heads
#    - If combined_head is True, then heads provided with keyword are combined and if it is False then they are processed separately
heads =

# metric (list)
#    Format: ["ACI1"], ["ACI3"], or ["ACI2", "ACI4"]
#    Description: Evaluation metrics to use for determining optimal clusters
#    Notes:
#    - At least one metric must be specified
#    - Supported metrics: ACI1, ACI2, ACI3, ACI4, Correlation, RMSE, Wasserstein
metric =

# hierarchical_clustering (boolean)
#    Format: True or False
#    Description: Enables two-stage hierarchical TimeSeriesKMeans clustering
#    Options:
#    - True:  Stage 1 clusters all files; Stage 2 sub-clusters each Stage 1 cluster
#             training_application_stage2_features and training_application_stage2_features_weightages are REQUIRED
#    - False: Single-stage clustering using training_application_stage1_features only
hierarchical_clustering =

# training_application_stage1_features (list)
#    Format: ["feature1", "feature2", ...] or "all"
#    Description: Features used for Stage 1 clustering
#    Notes:
#    - When hierarchical_clustering = False: these are the only features used for clustering
#    - When hierarchical_clustering = True: these are used for the global Stage 1 clustering
#    - Any combination from the valid list is accepted
#    - Valid features: real, imaginary, gain, phase, mag_gain, cos_phase, sin_phase,
#                     unwrapped_phase, slope_mag_gain, slope_unwrapped_phase,
#                     curvature_gain, curvature_phase, signed_peak_dev_mag_gain,
#                     signed_peak_dev_unwrapped_phase, moving_magnitude, moving_unwrapped_phase
#    - To use all 16 features, use "all" as the parameter value
training_application_stage1_features =

# training_application_stage1_features_weightages (list)
#    Format: [weight1, weight2, ...]
#    Description: Weightages for Stage 1 features
#    Notes:
#    - Length must match training_application_stage1_features
#    - All weights must be positive (>0)
#    - Higher weights give more influence to that feature during clustering
training_application_stage1_features_weightages =

# training_application_stage2_features (list)
#    Format: ["feature1", "feature2", ...] or "all"
#    Description: Features used for Stage 2 per-cluster sub-clustering
#    Notes:
#    - Required only when hierarchical_clustering = True
#    - Can overlap or differ entirely from Stage 1 features
#    - To use all 16 features, use "all" as the parameter value
training_application_stage2_features =

# training_application_stage2_features_weightages (list)
#    Format: [weight1, weight2, ...]
#    Description: Weightages for Stage 2 features
#    Notes:
#    - Required only when hierarchical_clustering = True
#    - Length must match training_application_stage2_features
#    - All weights must be positive (>0)
training_application_stage2_features_weightages =


[TRAINING_APP_OPTIONAL_PARAMETERS]

# worst_model_dir_list (string)
#    Format: "/path/to/worst_model_file_list.txt"
#    Description: Path to text file containing absolute paths to worst model .exv, .xpi or .xiz data files
#    Notes:
#    - If not provided, training proceeds with data_dir only
#    - Text file must exist and be readable if provided
#    - Each line must contain an absolute path to one .exv, .xpi or .xiz file
#    - No empty lines, headers, or comments allowed
#    - Files will be used for all heads
#    - Same train/validation split percentage will be applied
#    - Training data will be combined with data_dir training files
#    - Validation will be performed separately on both datasets
#    - Path provided in "worst_model_dir_list" should be without single quotes ("") or double quotes ("")
worst_model_dir_list =

# training_validation_split (list) - Default: [80, 20]
#    Format: [train_percentage, validation_percentage]
#    Description: Split ratio for training and validating data
#    Notes:
#    - Values must sum to 100
#    - Default is 80% training, 20% validation
#    - Special case [100, 0]: All data used for training, validation processing skipped
#    - Training percentage must be greater than validation percentage
training_validation_split =

# individual_frequencies_cluster_assignment_plots (boolean) - Default: False
#    Format: True or False
#    Description: Controls generation of 2D cluster plots and fan segment plots for individual frequencies
#    Notes:
#    - True: Generate plots for every individual frequency
#    - False: Skip individual frequency plots
individual_frequencies_cluster_assignment_plots =

# generate_interactive_html_plots (boolean) - Default: True
#    Format: True or False
#    Description: Controls generation of interactive HTML visualization files
#    Notes:
#    - True: Generate interactive HTML Bode plots and 3D files trajectory HTML
#    - False: Skip all interactive HTML visualization files
generate_interactive_html_plots =


[TRAINING_APP_BASELINE_DATA_SEPARATION]

# baseline_data_separation (boolean)
#    Format: True or False
#    Description: Enables baseline trend data separation before clustering
#    Options:
#    - True: Separates data into phase_lead/phase_lead/no_resonance groups based on baseline (x-axis)
#            before clustering. Requires baseline_data_filtering
#    - False: No separation, clustering proceeds as normal
baseline_data_separation =

# baseline_data_filtering (list)
#    Format: ["phase_lead", "phase_lag", "no_resonance"] or [["phase_lead", "no_resonance"], "phase_lag"] etc.
#    Description: Defines which classified groups are processed and how
#    Notes:
#    - One or more groups from (phase_lead, phase_lag, no_resonance) may be specified
#    - Only the groups listed will be processed; unlisted groups are ignored
#    - Flat list: each listed group is processed independently
#    - Nested list: groups inside a sublist are combined and processed together
#    - Strings are case-insensitive
#    - [[phase_lead, phase_lag, no_resonance]] all in one sublist is not allowed
#    - Only used when baseline_data_separation = True
#    Example: ["phase_lead", "phase_lag", "no_resonance"] processes all three independently
#    Example: [["phase_lead", "no_resonance"], "phase_lag"] combines phase_lead+no_resonance, phase_lag is separate
#    Example: ["phase_lead", "phase_lag"] processes only phase_lead and phase_lag; no_resonance files are discarded
baseline_data_filtering =
